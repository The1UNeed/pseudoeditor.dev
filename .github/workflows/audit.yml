name: Audit

# Catches advisory drift in production dependencies between releases: the gate
# runs weekly and on demand, not per push, so pre-existing low-severity
# advisories do not break every PR (CI keeps `pnpm test`/`lint` green instead).
on:
  schedule:
    - cron: "17 3 * * 0" # Sundays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Reads the lockfile only; no install step is needed.
      - run: pnpm audit --prod --audit-level=high
